<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600">
  <defs>
    <style>
      .bg { fill: #f2f3f4; }
      .board { fill: #ffffff; stroke: #c8cdd2; stroke-width: 2; }
      .key { fill: #f8f9fa; stroke: #747d84; stroke-width: 2; }
      .key-strong { fill: #30373d; stroke: #20262b; stroke-width: 2; }
      .key-soft { fill: #e3e6e8; stroke: #858e95; stroke-width: 2; }
      .title { fill: #1f252a; font-family: 'Microsoft YaHei'; font-size: 31px; font-weight: 700; }
      .section { fill: #30373d; font-family: 'Microsoft YaHei'; font-size: 19px; font-weight: 700; }
      .key-name { fill: #20262b; font-family: 'Microsoft YaHei'; font-size: 24px; font-weight: 700; text-anchor: middle; }
      .key-name-light { fill: #ffffff; font-family: 'Microsoft YaHei'; font-size: 24px; font-weight: 700; text-anchor: middle; }
      .desc { fill: #4f5961; font-family: 'Microsoft YaHei'; font-size: 14px; font-weight: 600; text-anchor: middle; }
      .desc-light { fill: #edf0f2; font-family: 'Microsoft YaHei'; font-size: 14px; font-weight: 600; text-anchor: middle; }
      .small { fill: #59636b; font-family: 'Microsoft YaHei'; font-size: 15px; font-weight: 500; }
      .side-key { fill: #252b30; font-family: 'Microsoft YaHei'; font-size: 17px; font-weight: 700; }
      .side-desc { fill: #505a62; font-family: 'Microsoft YaHei'; font-size: 14px; font-weight: 500; }
    </style>
  </defs>

  <rect class="bg" width="940" height="600"/>
  <rect class="board" x="18" y="18" width="904" height="564" rx="10"/>

  <text class="title" x="46" y="59">AnnotaFlow 快捷键</text>
  <text class="small" x="46" y="84">按 H 打开快捷键总览，再按 H 关闭。深色按键是标注时最常用的操作。</text>

  <g transform="translate(46 108)">
    <text class="section" x="0" y="0">快速选择类别</text>
    <rect class="key-soft" x="0" y="16" width="84" height="54" rx="6"/>
    <text class="key-name" x="42" y="49">Ctrl</text>
    <text class="key-name" x="103" y="50">+</text>
    <g transform="translate(124 16)">
      <rect class="key" x="0" y="0" width="46" height="54" rx="6"/><text class="key-name" x="23" y="35">1</text>
      <rect class="key" x="52" y="0" width="46" height="54" rx="6"/><text class="key-name" x="75" y="35">2</text>
      <rect class="key" x="104" y="0" width="46" height="54" rx="6"/><text class="key-name" x="127" y="35">3</text>
      <rect class="key" x="156" y="0" width="46" height="54" rx="6"/><text class="key-name" x="179" y="35">4</text>
      <rect class="key" x="208" y="0" width="46" height="54" rx="6"/><text class="key-name" x="231" y="35">5</text>
      <rect class="key" x="260" y="0" width="46" height="54" rx="6"/><text class="key-name" x="283" y="35">6</text>
      <rect class="key" x="312" y="0" width="46" height="54" rx="6"/><text class="key-name" x="335" y="35">7</text>
      <rect class="key" x="364" y="0" width="46" height="54" rx="6"/><text class="key-name" x="387" y="35">8</text>
      <rect class="key" x="416" y="0" width="46" height="54" rx="6"/><text class="key-name" x="439" y="35">9</text>
      <rect class="key" x="468" y="0" width="46" height="54" rx="6"/><text class="key-name" x="491" y="35">0</text>
    </g>
  </g>

  <line x1="46" y1="194" x2="894" y2="194" stroke="#d1d5d8" stroke-width="2"/>
  <text class="section" x="46" y="224">集中操作区</text>

  <g transform="translate(46 242)">
    <g transform="translate(0 0)">
      <rect class="key-strong" width="90" height="72" rx="7"/>
      <text class="key-name-light" x="45" y="29">Q</text><text class="desc-light" x="45" y="54">取消操作</text>
    </g>
    <g transform="translate(98 0)">
      <rect class="key-strong" width="90" height="72" rx="7"/>
      <text class="key-name-light" x="45" y="29">W</text><text class="desc-light" x="45" y="54">画框模式</text>
    </g>
    <g transform="translate(196 0)">
      <rect class="key-strong" width="90" height="72" rx="7"/>
      <text class="key-name-light" x="45" y="29">E</text><text class="desc-light" x="45" y="54">AI 点选</text>
    </g>
    <g transform="translate(294 0)">
      <rect class="key-strong" width="90" height="72" rx="7"/>
      <text class="key-name-light" x="45" y="29">R</text><text class="desc-light" x="45" y="54">接受候选</text>
    </g>
    <g transform="translate(392 0)">
      <rect class="key-strong" width="90" height="72" rx="7"/>
      <text class="key-name-light" x="45" y="29">T</text><text class="desc-light" x="45" y="54">撤销选点</text>
    </g>
    <g transform="translate(490 0)">
      <rect class="key-soft" width="90" height="72" rx="7"/>
      <text class="key-name" x="45" y="29">Y</text><text class="desc" x="45" y="54">重做标注</text>
    </g>

    <g transform="translate(22 82)">
      <rect class="key" width="90" height="72" rx="7"/>
      <text class="key-name" x="45" y="29">A</text><text class="desc" x="45" y="54">上一张</text>
    </g>
    <g transform="translate(120 82)">
      <rect class="key-strong" width="90" height="72" rx="7"/>
      <text class="key-name-light" x="45" y="29">S</text><text class="desc-light" x="45" y="54">保存</text>
    </g>
    <g transform="translate(218 82)">
      <rect class="key" width="90" height="72" rx="7"/>
      <text class="key-name" x="45" y="29">D</text><text class="desc" x="45" y="54">下一张</text>
    </g>
    <g transform="translate(316 82)">
      <rect class="key" width="90" height="72" rx="7"/>
      <text class="key-name" x="45" y="29">F</text><text class="desc" x="45" y="54">适应窗口</text>
    </g>
    <g transform="translate(414 82)">
      <rect class="key-soft" width="120" height="72" rx="7"/>
      <text class="key-name" x="60" y="29">H</text><text class="desc" x="60" y="54">打开 / 关闭总览</text>
    </g>

    <g transform="translate(48 176)">
      <rect class="key-soft" width="104" height="76" rx="7"/>
      <text class="key-name" x="52" y="31">Z</text><text class="desc" x="52" y="57">撤销标注</text>
    </g>
    <g transform="translate(190 176)">
      <rect class="key" width="126" height="76" rx="7"/>
      <text class="key-name" x="63" y="31">Delete</text><text class="desc" x="63" y="57">删除选中标注</text>
    </g>
    <g transform="translate(326 176)">
      <rect class="key" width="126" height="76" rx="7"/>
      <text class="key-name" x="63" y="31">Esc</text><text class="desc" x="63" y="57">取消 AI 候选</text>
    </g>
    <g transform="translate(462 176)">
      <rect class="key" width="126" height="76" rx="7"/>
      <text class="key-name" x="63" y="31">Enter</text><text class="desc" x="63" y="57">接受候选</text>
    </g>
  </g>

  <line x1="650" y1="216" x2="650" y2="520" stroke="#d1d5d8" stroke-width="2"/>
  <g transform="translate(676 224)">
    <text class="section" x="0" y="0">文件与视图</text>

    <rect class="key-soft" x="0" y="18" width="218" height="50" rx="6"/>
    <text class="side-key" x="14" y="49">Ctrl+O</text><text class="side-desc" x="92" y="49">打开图片文件夹</text>

    <rect class="key-soft" x="0" y="78" width="218" height="50" rx="6"/>
    <text class="side-key" x="14" y="109">Ctrl+R</text><text class="side-desc" x="92" y="109">选择标签目录</text>

    <rect class="key-soft" x="0" y="138" width="218" height="50" rx="6"/>
    <text class="side-key" x="14" y="169">Ctrl+Shift+S</text><text class="side-desc" x="132" y="169">另存为</text>

    <rect class="key-soft" x="0" y="198" width="218" height="50" rx="6"/>
    <text class="side-key" x="14" y="229">Ctrl + / -</text><text class="side-desc" x="118" y="229">缩放图片</text>

    <rect class="key-soft" x="0" y="258" width="218" height="50" rx="6"/>
    <text class="side-key" x="14" y="289">中键 / Ctrl+左键</text><text class="side-desc" x="154" y="289">平移</text>
  </g>

  <text class="small" x="46" y="558">AI 点选：左键添加目标点，右键添加排除点；T 逐点撤销，Q 或 Esc 取消整次候选。</text>
</svg>
